<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="monospace, sans-serif">

  <!-- Background -->
  <rect width="900" height="620" fill="#f8f9fa" rx="10"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">ESP32 Expansion Board – Vendo Machine</text>
  <line x1="60" y1="48" x2="840" y2="48" stroke="#1a1a2e" stroke-width="1.5"/>

  <!-- ===== ESP32 MODULE ===== -->
  <rect x="310" y="150" width="280" height="320" rx="8" fill="#1a1a2e" stroke="#00d4ff" stroke-width="2"/>
  <text x="450" y="178" text-anchor="middle" font-size="14" font-weight="bold" fill="#00d4ff">ESP32</text>
  <text x="450" y="196" text-anchor="middle" font-size="10" fill="#aaa">Wi-Fi + BT Module</text>

  <!-- ESP32 pin labels – left side -->
  <text x="375" y="240" text-anchor="middle" font-size="10" fill="#fff">3V3</text>
  <text x="375" y="265" text-anchor="middle" font-size="10" fill="#fff">GND</text>
  <text x="375" y="290" text-anchor="middle" font-size="10" fill="#fff">GPIO2</text>
  <text x="375" y="315" text-anchor="middle" font-size="10" fill="#fff">GPIO21</text>
  <text x="375" y="340" text-anchor="middle" font-size="10" fill="#fff">GPIO22</text>
  <text x="375" y="365" text-anchor="middle" font-size="10" fill="#fff">GPIO23</text>
  <text x="375" y="390" text-anchor="middle" font-size="10" fill="#fff">GPIO27</text>
  <text x="375" y="430" text-anchor="middle" font-size="10" fill="#fff">5V IN</text>

  <!-- Pin stubs – left -->
  <line x1="310" y1="237" x2="280" y2="237" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="310" y1="262" x2="280" y2="262" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="310" y1="287" x2="280" y2="287" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="310" y1="312" x2="280" y2="312" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="310" y1="337" x2="280" y2="337" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="310" y1="362" x2="280" y2="362" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="310" y1="387" x2="280" y2="387" stroke="#00d4ff" stroke-width="1.5"/>
  <line x1="310" y1="427" x2="280" y2="427" stroke="#ffd700" stroke-width="1.5"/>

  <!-- ===== POWER SUPPLY ===== -->
  <rect x="60" y="390" width="130" height="70" rx="6" fill="#2d2d44" stroke="#ffd700" stroke-width="2"/>
  <text x="125" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffd700">5V PSU</text>
  <text x="125" y="436" text-anchor="middle" font-size="10" fill="#aaa">DC Power Supply</text>
  <text x="125" y="452" text-anchor="middle" font-size="10" fill="#ffd700">5V / 2A</text>
  <!-- Power line from PSU to ESP32 5V IN -->
  <line x1="190" y1="425" x2="280" y2="427" stroke="#ffd700" stroke-width="2"/>

  <!-- 3V3 rail -->
  <line x1="280" y1="237" x2="200" y2="237" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="200" y1="237" x2="200" y2="70" stroke="#ff6b6b" stroke-width="2"/>
  <text x="196" y="66" text-anchor="end" font-size="10" fill="#ff6b6b">3V3</text>

  <!-- GND rail -->
  <line x1="280" y1="262" x2="210" y2="262" stroke="#4ecdc4" stroke-width="2"/>
  <line x1="210" y1="262" x2="210" y2="580" stroke="#4ecdc4" stroke-width="2"/>
  <text x="206" y="594" text-anchor="end" font-size="10" fill="#4ecdc4">GND</text>

  <!-- ===== STATUS LED (GPIO2) ===== -->
  <rect x="60" y="256" width="130" height="62" rx="6" fill="#2d2d44" stroke="#ffdd57" stroke-width="2"/>
  <text x="125" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffdd57">Status LED</text>
  <text x="125" y="296" text-anchor="middle" font-size="10" fill="#aaa">GPIO2 → LED</text>
  <text x="125" y="312" text-anchor="middle" font-size="10" fill="#ffdd57">330 Ω series R</text>
  <!-- Wire GPIO2 → resistor → LED block -->
  <polyline points="280,287 250,287 250,287" fill="none" stroke="#ffdd57" stroke-width="2"/>
  <rect x="222" y="280" width="28" height="14" rx="2" fill="#2d2d44" stroke="#ffdd57" stroke-width="1.5"/>
  <text x="236" y="290" text-anchor="middle" font-size="7" fill="#ffdd57">330Ω</text>
  <line x1="222" y1="287" x2="190" y2="287" stroke="#ffdd57" stroke-width="2"/>
  <!-- GND leg of LED to GND bus -->
  <line x1="125" y1="318" x2="125" y2="560" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="125" y1="560" x2="210" y2="560" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== I2C LCD DISPLAY (GPIO21 SDA, GPIO22 SCL) ===== -->
  <rect x="60" y="130" width="130" height="80" rx="6" fill="#2d2d44" stroke="#a29bfe" stroke-width="2"/>
  <text x="125" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#a29bfe">LCD Display</text>
  <text x="125" y="173" text-anchor="middle" font-size="10" fill="#aaa">I2C (16×2)</text>
  <text x="125" y="191" text-anchor="middle" font-size="10" fill="#a29bfe">SDA / SCL</text>
  <!-- SDA routing with pull-up resistor marker -->
  <polyline points="190,162 260,162 260,312 280,312" fill="none" stroke="#a29bfe" stroke-width="1.5"/>
  <!-- SCL routing -->
  <polyline points="190,174 266,174 266,337 280,337" fill="none" stroke="#a29bfe" stroke-width="1.5"/>
  <!-- Pull-up labels -->
  <rect x="254" y="155" width="28" height="12" rx="2" fill="#2d2d44" stroke="#a29bfe" stroke-width="1.2"/>
  <text x="268" y="164" text-anchor="middle" font-size="7" fill="#a29bfe">4.7k</text>
  <rect x="254" y="167" width="28" height="12" rx="2" fill="#2d2d44" stroke="#a29bfe" stroke-width="1.2"/>
  <text x="268" y="176" text-anchor="middle" font-size="7" fill="#a29bfe">4.7k</text>
  <!-- VCC to LCD -->
  <line x1="125" y1="130" x2="125" y2="100" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="125" y1="100" x2="200" y2="100" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="200" y1="100" x2="200" y2="237" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ===== RELAY / OUTPUT CONTROL (GPIO23) ===== -->
  <rect x="590" y="330" width="150" height="80" rx="6" fill="#2d2d44" stroke="#fd79a8" stroke-width="2"/>
  <text x="665" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#fd79a8">Relay Module</text>
  <text x="665" y="375" text-anchor="middle" font-size="10" fill="#aaa">Output Control</text>
  <text x="665" y="393" text-anchor="middle" font-size="10" fill="#fd79a8">GPIO23</text>
  <!-- Dispense actuator -->
  <rect x="760" y="330" width="120" height="80" rx="6" fill="#2d2d44" stroke="#fd79a8" stroke-width="2"/>
  <text x="820" y="357" text-anchor="middle" font-size="11" font-weight="bold" fill="#fd79a8">Dispense</text>
  <text x="820" y="373" text-anchor="middle" font-size="10" fill="#fd79a8">Actuator</text>
  <text x="820" y="389" text-anchor="middle" font-size="9" fill="#aaa">(Solenoid/Motor)</text>
  <line x1="740" y1="370" x2="760" y2="370" stroke="#fd79a8" stroke-width="2"/>
  <!-- GPIO23 route from left side of ESP32 to relay -->
  <polyline points="280,362 245,362 245,370 590,370" fill="none" stroke="#fd79a8" stroke-width="2"/>
  <!-- Relay VCC from PSU (5V) -->
  <line x1="590" y1="338" x2="570" y2="338" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="570" y1="338" x2="570" y2="550" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="570" y1="550" x2="125" y2="550" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="125" y1="550" x2="125" y2="460" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== COIN ACCEPTOR (GPIO27) ===== -->
  <rect x="590" y="200" width="150" height="80" rx="6" fill="#2d2d44" stroke="#55efc4" stroke-width="2"/>
  <text x="665" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#55efc4">Coin Acceptor</text>
  <text x="665" y="245" text-anchor="middle" font-size="10" fill="#aaa">Coin Input Sensor</text>
  <text x="665" y="263" text-anchor="middle" font-size="10" fill="#55efc4">GPIO27</text>
  <!-- GPIO27 route from left side of ESP32 to coin acceptor -->
  <polyline points="280,387 240,387 240,240 590,240" fill="none" stroke="#55efc4" stroke-width="2"/>
  <!-- Coin acceptor VCC (3V3) -->
  <line x1="590" y1="208" x2="560" y2="208" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="560" y1="208" x2="560" y2="80" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="560" y1="80" x2="200" y2="80" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="200" y1="80" x2="200" y2="237" stroke="#ff6b6b" stroke-width="0.5" stroke-dasharray="4,3"/>
  <!-- Coin acceptor GND -->
  <line x1="590" y1="272" x2="555" y2="272" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="555" y1="272" x2="555" y2="540" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="555" y1="540" x2="210" y2="540" stroke="#4ecdc4" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ===== LEGEND ===== -->
  <rect x="640" y="460" width="230" height="140" rx="6" fill="#1a1a2e" stroke="#555" stroke-width="1"/>
  <text x="755" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Legend</text>
  <line x1="652" y1="492" x2="682" y2="492" stroke="#ff6b6b" stroke-width="2"/>
  <text x="690" y="496" font-size="10" fill="#ff6b6b">3.3 V Power</text>
  <line x1="652" y1="510" x2="682" y2="510" stroke="#ffd700" stroke-width="2"/>
  <text x="690" y="514" font-size="10" fill="#ffd700">5 V Power</text>
  <line x1="652" y1="528" x2="682" y2="528" stroke="#4ecdc4" stroke-width="2"/>
  <text x="690" y="532" font-size="10" fill="#4ecdc4">GND</text>
  <line x1="652" y1="546" x2="682" y2="546" stroke="#00d4ff" stroke-width="2"/>
  <text x="690" y="550" font-size="10" fill="#00d4ff">Signal</text>
  <line x1="652" y1="564" x2="682" y2="564" stroke="#a29bfe" stroke-width="2"/>
  <text x="690" y="568" font-size="10" fill="#a29bfe">I2C (SDA / SCL)</text>
  <line x1="652" y1="582" x2="682" y2="582" stroke="#aaa" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="690" y="586" font-size="10" fill="#aaa">Power bus (dashed)</text>

  <!-- ===== GPIO TABLE ===== -->
  <rect x="310" y="490" width="280" height="112" rx="6" fill="#1a1a2e" stroke="#555" stroke-width="1"/>
  <text x="450" y="510" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">GPIO Mapping</text>
  <line x1="320" y1="518" x2="580" y2="518" stroke="#555" stroke-width="1"/>
  <text x="340" y="533" font-size="10" fill="#ffdd57">GPIO2</text>
  <text x="420" y="533" font-size="10" fill="#aaa">→</text>
  <text x="440" y="533" font-size="10" fill="#ffdd57">System LED</text>
  <text x="340" y="549" font-size="10" fill="#a29bfe">GPIO21</text>
  <text x="420" y="549" font-size="10" fill="#aaa">→</text>
  <text x="440" y="549" font-size="10" fill="#a29bfe">I2C SDA (LCD)</text>
  <text x="340" y="565" font-size="10" fill="#a29bfe">GPIO22</text>
  <text x="420" y="565" font-size="10" fill="#aaa">→</text>
  <text x="440" y="565" font-size="10" fill="#a29bfe">I2C SCL (LCD)</text>
  <text x="340" y="581" font-size="10" fill="#fd79a8">GPIO23</text>
  <text x="420" y="581" font-size="10" fill="#aaa">→</text>
  <text x="440" y="581" font-size="10" fill="#fd79a8">Output / Relay</text>
  <text x="340" y="597" font-size="10" fill="#55efc4">GPIO27</text>
  <text x="420" y="597" font-size="10" fill="#aaa">→</text>
  <text x="440" y="597" font-size="10" fill="#55efc4">Coin Input</text>

</svg>
