<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .component-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .power-box { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .esp32-box { fill: #e8f5e9; stroke: #388e3c; stroke-width: 2; }
      .text-title { font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #333; }
      .text-label { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
      .text-small { font-family: Arial, sans-serif; font-size: 10px; fill: #666; }
      .wire { stroke: #333; stroke-width: 2; fill: none; }
      .wire-power { stroke: #d32f2f; stroke-width: 2.5; fill: none; }
      .wire-gnd { stroke: #000; stroke-width: 2.5; fill: none; }
      .wire-signal { stroke: #1976d2; stroke-width: 2; fill: none; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1976d2; }
    </style>
  </defs>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">ESP32 Expansion Board - JuanFi DC Control Architecture</text>
  
  <!-- AC Mains Input -->
  <rect x="50" y="60" width="120" height="60" class="power-box"/>
  <text x="110" y="85" text-anchor="middle" class="text-title">AC Mains</text>
  <text x="110" y="105" text-anchor="middle" class="text-label">220V AC</text>
  
  <!-- 12V SMPS -->
  <rect x="220" y="60" width="140" height="80" class="power-box"/>
  <text x="290" y="85" text-anchor="middle" class="text-title">12V SMPS</text>
  <text x="290" y="105" text-anchor="middle" class="text-label">3A Output</text>
  <text x="290" y="125" text-anchor="middle" class="text-small">AC→DC Conversion</text>
  
  <!-- Wire from AC to SMPS -->
  <line x1="170" y1="90" x2="220" y2="90" class="wire"/>
  
  <!-- LM2596 Buck Converter -->
  <rect x="420" y="60" width="160" height="100" class="component-box"/>
  <text x="500" y="90" text-anchor="middle" class="text-title">LM2596</text>
  <text x="500" y="110" text-anchor="middle" class="text-label">Buck Converter</text>
  <text x="500" y="130" text-anchor="middle" class="text-small">12V → 5V</text>
  <text x="500" y="145" text-anchor="middle" class="text-small">3A Max</text>
  
  <!-- Wire from SMPS to Buck (12V) -->
  <line x1="360" y1="80" x2="420" y2="80" class="wire-power"/>
  <text x="390" y="75" text-anchor="middle" class="text-small">12V</text>
  
  <!-- ESP32 Module -->
  <rect x="640" y="50" width="200" height="280" class="esp32-box"/>
  <text x="740" y="75" text-anchor="middle" class="text-title">ESP32 Module</text>
  <text x="740" y="95" text-anchor="middle" class="text-small">WiFi/BLE Enabled</text>
  
  <!-- ESP32 GPIO Pins -->
  <text x="660" y="125" class="text-label">GPIO D6 (Coin) ←</text>
  <text x="660" y="145" class="text-label">GPIO D7 (Control) →</text>
  <text x="660" y="165" class="text-label">GPIO 21 (SDA) ↔</text>
  <text x="660" y="185" class="text-label">GPIO 22 (SCL) →</text>
  <text x="660" y="205" class="text-label">GPIO 2 (LED) →</text>
  <text x="660" y="230" class="text-label">VCC (5V)</text>
  <text x="660" y="250" class="text-label">GND</text>
  
  <!-- Wire from Buck to ESP32 (5V) -->
  <line x1="580" y1="100" x2="640" y2="100" class="wire-power"/>
  <text x="610" y="95" text-anchor="middle" class="text-small">5V</text>
  
  <!-- Wire from Buck to ESP32 (GND) -->
  <line x1="580" y1="130" x2="640" y2="130" class="wire-gnd"/>
  <text x="610" y="125" text-anchor="middle" class="text-small">GND</text>
  
  <!-- Coin Acceptor -->
  <rect x="420" y="220" width="140" height="100" class="component-box"/>
  <text x="490" y="245" text-anchor="middle" class="text-title">Coin Acceptor</text>
  <text x="490" y="265" text-anchor="middle" class="text-label">12V Type</text>
  <text x="490" y="285" text-anchor="middle" class="text-small">Pulse Output</text>
  <text x="490" y="305" text-anchor="middle" class="text-small">Universal Slot</text>
  
  <!-- Wire from SMPS to Coin Acceptor (12V) -->
  <line x1="360" y1="120" x2="380" y2="120" class="wire-power"/>
  <line x1="380" y1="120" x2="380" y2="250" class="wire-power"/>
  <line x1="380" y1="250" x2="420" y2="250" class="wire-power"/>
  <text x="390" y="180" text-anchor="middle" class="text-small">12V</text>
  
  <!-- Wire from Coin to ESP32 (Pulse Signal) -->
  <line x1="560" y1="270" x2="600" y2="270" class="wire-signal"/>
  <line x1="600" y1="270" x2="600" y2="125" class="wire-signal"/>
  <line x1="600" y1="125" x2="640" y2="125" class="wire-signal"/>
  <text x="580" y="200" text-anchor="middle" class="text-small">Pulse</text>
  
  <!-- PC817 Optocoupler -->
  <rect x="900" y="120" width="140" height="100" class="component-box"/>
  <text x="970" y="145" text-anchor="middle" class="text-title">PC817</text>
  <text x="970" y="165" text-anchor="middle" class="text-label">Optocoupler</text>
  <text x="970" y="185" text-anchor="middle" class="text-small">Isolation</text>
  <text x="970" y="205" text-anchor="middle" class="text-small">LED + Phototransistor</text>
  
  <!-- Wire from ESP32 GPIO D7 to PC817 -->
  <line x1="840" y1="145" x2="900" y2="145" class="wire-signal"/>
  <text x="870" y="140" text-anchor="middle" class="text-small">D7</text>
  
  <!-- Resistors for PC817 -->
  <rect x="920" y="100" width="100" height="15" fill="#d7ccc8" stroke="#5d4037" stroke-width="1"/>
  <text x="970" y="112" text-anchor="middle" class="text-small">330Ω</text>
  
  <rect x="920" y="225" width="100" height="15" fill="#d7ccc8" stroke="#5d4037" stroke-width="1"/>
  <text x="970" y="237" text-anchor="middle" class="text-small">10kΩ Pull-up</text>
  
  <!-- IRLZ44N MOSFET -->
  <rect x="900" y="280" width="140" height="120" class="component-box"/>
  <text x="970" y="305" text-anchor="middle" class="text-title">IRLZ44N</text>
  <text x="970" y="325" text-anchor="middle" class="text-label">N-Channel MOSFET</text>
  <text x="970" y="345" text-anchor="middle" class="text-small">Logic-Level</text>
  <text x="970" y="365" text-anchor="middle" class="text-small">47A, 55V</text>
  <text x="970" y="385" text-anchor="middle" class="text-small">TO-220 Package</text>
  
  <!-- Wire from PC817 to MOSFET Gate -->
  <line x1="970" y1="220" x2="970" y2="280" class="wire-signal"/>
  <text x="985" y="250" text-anchor="start" class="text-small">Gate</text>
  
  <!-- 12V DC Load -->
  <rect x="900" y="450" width="140" height="80" class="component-box"/>
  <text x="970" y="475" text-anchor="middle" class="text-title">DC Load</text>
  <text x="970" y="495" text-anchor="middle" class="text-label">12V Device</text>
  <text x="970" y="515" text-anchor="middle" class="text-small">(Dispenser/Motor)</text>
  
  <!-- Wire from MOSFET to Load -->
  <line x1="970" y1="400" x2="970" y2="450" class="wire-power"/>
  <text x="985" y="425" text-anchor="start" class="text-small">Drain</text>
  
  <!-- Wire from 12V SMPS to Load -->
  <line x1="360" y1="100" x2="390" y2="100" class="wire-power"/>
  <line x1="390" y1="100" x2="390" y2="480" class="wire-power"/>
  <line x1="390" y1="480" x2="900" y2="480" class="wire-power"/>
  <text x="395" y="290" text-anchor="start" class="text-small">12V</text>
  
  <!-- Ground connections -->
  <line x1="290" y1="140" x2="290" y2="600" class="wire-gnd"/>
  <line x1="290" y1="600" x2="1100" y2="600" class="wire-gnd"/>
  <line x1="970" y1="530" x2="970" y2="600" class="wire-gnd"/>
  <line x1="490" y1="320" x2="490" y2="600" class="wire-gnd"/>
  <line x1="740" y1="330" x2="740" y2="600" class="wire-gnd"/>
  <line x1="1020" y1="400" x2="1020" y2="600" class="wire-gnd"/>
  
  <text x="600" y="620" text-anchor="middle" class="text-label">COMMON GROUND</text>
  
  <!-- I2C LCD Display -->
  <rect x="640" y="380" width="200" height="100" class="component-box"/>
  <text x="740" y="405" text-anchor="middle" class="text-title">LCD Display</text>
  <text x="740" y="425" text-anchor="middle" class="text-label">I2C Interface</text>
  <text x="740" y="445" text-anchor="middle" class="text-small">16x2 or 20x4</text>
  <text x="740" y="465" text-anchor="middle" class="text-small">Address: 0x27/0x3F</text>
  
  <!-- I2C Pull-up Resistors -->
  <rect x="620" y="355" width="60" height="15" fill="#d7ccc8" stroke="#5d4037" stroke-width="1"/>
  <text x="650" y="367" text-anchor="middle" class="text-small">4.7kΩ</text>
  
  <!-- Wire from ESP32 to LCD (I2C) -->
  <line x1="740" y1="330" x2="740" y2="380" class="wire-signal"/>
  <text x="755" y="355" text-anchor="start" class="text-small">SDA/SCL</text>
  
  <!-- Flyback Diode -->
  <circle cx="1100" cy="480" r="20" fill="none" stroke="#1976d2" stroke-width="2"/>
  <line x1="1090" y1="465" x2="1110" y2="495" stroke="#1976d2" stroke-width="2"/>
  <text x="1100" y="520" text-anchor="middle" class="text-small">Flyback</text>
  <text x="1100" y="535" text-anchor="middle" class="text-small">Diode</text>
  
  <!-- Status LED -->
  <circle cx="820" cy="210" r="15" fill="#ffeb3b" stroke="#f57f17" stroke-width="2"/>
  <line x1="840" y1="205" x2="880" y2="205" class="wire"/>
  <rect x="880" y="200" width="40" height="10" fill="#d7ccc8" stroke="#5d4037" stroke-width="1"/>
  <text x="900" y="195" text-anchor="middle" class="text-small">330Ω</text>
  
  <!-- Legend -->
  <rect x="50" y="650" width="1100" height="120" fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="670" class="text-title">Component Notes:</text>
  <text x="60" y="690" class="text-small">• PC817: Provides galvanic isolation between ESP32 (5V logic) and 12V load circuit</text>
  <text x="60" y="705" class="text-small">• IRLZ44N: Logic-level MOSFET, switches on with 5V gate signal, handles up to 47A</text>
  <text x="60" y="720" class="text-small">• Flyback Diode: Protects against voltage spikes from inductive loads</text>
  <text x="60" y="735" class="text-small">• 10kΩ Pull-up: Ensures MOSFET stays off when PC817 is not conducting</text>
  <text x="60" y="750" class="text-small">• Power Budget: ESP32 (260mA) + LCD (50mA) + Coin (100mA) = ~410mA from 5V rail</text>
</svg>